<style>/* Layout: celoobrazovková aplikace – horní pás hráčů, mapa s posunem/zoomem, dolní „lístek" s akcemi. */
[hidden] { display: none !important; }
:root {
  --ink: #14203b;
  --ink-2: #22345e;
  --ink-3: #3a4d7a;
  --paper: #f1e9d6;
  --paper-2: #e4d8bd;
  --paper-3: #d3c39f;
  --stamp: #c62420;
  --stamp-2: #9e1714;
  --gold: #b88a2c;
  --text: #1a2036;
  --muted: #5f6070;
  --ok: #2c7a3f;
  --sea: #b7dde6;
  --f-display: 'Alfa Slab One', 'Rockwell', 'Georgia', serif;
  --f-ui: 'Barlow Condensed', 'Arial Narrow', 'Roboto Condensed', sans-serif;
  --f-body: 'Barlow', 'Segoe UI', system-ui, sans-serif;
  color-scheme: light;
}
html, body { height: 100%; }
body {
  margin: 0; background: var(--ink); color: var(--text);
  font-family: var(--f-body); font-size: 15px; overflow: hidden;
  -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none;
  overscroll-behavior: none;
}
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }

#app { position: fixed; inset: 0; display: flex; flex-direction: column;
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }

/* ---------- horní pás ---------- */
#topbar { flex: none; display: flex; align-items: stretch; gap: 6px; background: var(--ink);
  padding: 6px max(10px, env(safe-area-inset-right, 0px)) 6px max(10px, env(safe-area-inset-left, 0px));
  border-bottom: 3px solid var(--stamp); }
#chips { flex: 1; min-width: 0; display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
#chips::-webkit-scrollbar { display: none; }
.chip { flex: none; display: flex; align-items: center; gap: 6px; padding: 4px 9px 4px 5px; border-radius: 6px;
  background: var(--ink-2); color: #e9e3d2; border: 1px solid transparent; font-family: var(--f-ui); line-height: 1.05; }
.chip.cur { background: var(--paper); color: var(--text); border-color: var(--gold); }
.chip.dead { opacity: .4; text-decoration: line-through; }
.chip .nm { font-weight: 600; font-size: 14px; max-width: 86px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chip .cs { font-size: 13px; opacity: .85; }
.chip .meta { display: flex; flex-direction: column; }
.chip.debt .cs { color: var(--stamp); opacity: 1; font-weight: 700; }
#lastroll { position: absolute; top: 9px; left: 10px; z-index: 4; display: flex; align-items: center; gap: 5px; padding: 6px 9px; border-radius: 9px;
  background: var(--paper); border: 2px solid var(--ink); border-top: 4px solid var(--pc, var(--ink)); box-shadow: 0 4px 12px rgba(0,0,0,.28);
  transition: left .35s ease; pointer-events: none; }
#lastroll::before { content: ""; position: absolute; top: -12px; left: var(--ax, 22px); border: 7px solid transparent; border-bottom-color: var(--pc, var(--ink)); transform: translateX(-50%); transition: left .35s ease; }
#lastroll .die { width: 30px; height: 30px; border-radius: 6px; padding: 4px; border-width: 1.5px; box-shadow: 0 1px 0 var(--ink); }
#lastroll .die i { width: 5px; height: 5px; }
#lastroll .sum { font-family: var(--f-ui); font-weight: 700; color: var(--ink); font-size: 19px; margin-left: 2px; }
#lastroll .who { font-family: var(--f-ui); font-size: 13px; color: var(--muted); margin-right: 2px; max-width: 70px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.iconbtn { flex: none; width: 40px; border-radius: 6px; border: 0; background: var(--ink-2); color: #efe8d6; display: grid; place-items: center; }
.iconbtn svg { width: 22px; height: 22px; }

/* hvězdná značka hráče */
.star-badge { width: 26px; height: 26px; flex: none; }

/* ---------- mapa ---------- */
#mapwrap { position: relative; flex: 1; min-height: 0; overflow: hidden; background: var(--sea); touch-action: none; }
#world { position: absolute; left: 0; top: 0; transform-origin: 0 0; will-change: transform; }
#world img { display: block; max-width: none; pointer-events: none; -webkit-user-drag: none; }
#overlay { position: absolute; left: 0; top: 0; overflow: visible; }
.mapctl { position: absolute; right: max(10px, env(safe-area-inset-right, 0px)); top: 10px; display: flex; flex-direction: column; gap: 6px; }
.mapctl button { width: 40px; height: 40px; border-radius: 8px; border: 1px solid rgba(20,32,59,.25); background: rgba(241,233,214,.94); color: var(--ink); font-size: 20px; font-weight: 700; box-shadow: 0 2px 6px rgba(0,0,0,.18); display: grid; place-items: center; }
.mapctl button svg { width: 20px; height: 20px; }
#steps { position: absolute; left: max(10px, env(safe-area-inset-left, 0px)); top: 66px; background: var(--ink); color: var(--paper); padding: 6px 10px; border-radius: 8px; font-family: var(--f-ui); font-size: 15px; box-shadow: 0 2px 8px rgba(0,0,0,.25); }
#steps b { font-size: 22px; color: #ffd66b; margin-right: 4px; }

.opt-ring { fill: rgba(255, 214, 107, .35); stroke: #ffb800; animation: pulse 1.1s ease-in-out infinite; cursor: pointer; }
.opt-txt { font-family: var(--f-ui); font-weight: 700; fill: var(--ink); paint-order: stroke; stroke: #fff; pointer-events: none; }
@keyframes pulse { 50% { fill: rgba(255, 214, 107, .7); } }
.trail { fill: none; stroke-linecap: round; stroke-linejoin: round; opacity: .85; }
.pawn { transition: transform .16s ease-out; }
.mk { cursor: pointer; }

/* ---------- dolní panel ---------- */
#panel { flex: none; background: var(--paper); border-top: 3px solid var(--ink); position: relative;
  padding: 10px max(14px, env(safe-area-inset-right, 0px)) 12px max(14px, env(safe-area-inset-left, 0px));
  max-height: 46vh; overflow-y: auto; box-shadow: 0 -6px 18px rgba(0,0,0,.25); }
#panel::before { content: ""; position: absolute; left: 0; right: 0; top: -9px; height: 6px;
  background: radial-gradient(circle at 6px 6px, var(--paper) 3px, transparent 3.5px) 0 0 / 12px 6px repeat-x; }
.ph { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
.ph h2 { margin: 0; font-family: var(--f-display); font-weight: 400; font-size: 21px; letter-spacing: .3px; color: var(--ink); line-height: 1.1; text-wrap: balance; }
.ph .sub { font-family: var(--f-ui); font-size: 14px; color: var(--muted); }
.row { display: flex; gap: 8px; flex-wrap: wrap; }
.row > * { flex: 1 1 auto; }
.btn { border: 0; border-radius: 8px; padding: 11px 14px; font-family: var(--f-ui); font-size: 17px; font-weight: 600; letter-spacing: .3px;
  background: var(--ink); color: var(--paper); min-height: 46px; }
.btn.red { background: var(--stamp); color: #fff; }
.btn.ghost { background: transparent; color: var(--ink); border: 2px solid var(--ink); }
.btn.soft { background: var(--paper-2); color: var(--ink); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.big { font-size: 21px; min-height: 56px; }
.btn small { display: block; font-size: 12.5px; font-weight: 500; opacity: .85; letter-spacing: 0; }
.dicesel { display: flex; gap: 6px; margin: 2px 0 10px; }
.dicesel button { flex: 1; border: 2px solid var(--paper-3); background: var(--paper); border-radius: 8px; padding: 5px 2px; font-family: var(--f-ui); line-height: 1.1; }
.dicesel button[aria-pressed="true"] { border-color: var(--ink); background: var(--ink); color: var(--paper); }
.dicesel b { font-size: 17px; display: block; }
.dicesel span { font-size: 12px; opacity: .8; }

.wallet { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
.wallet .amt { font-family: var(--f-display); font-size: 26px; color: var(--ink); }
.bills { position: relative; height: 40px; flex: 1; min-width: 0; }
.bills img { position: absolute; top: 0; height: 38px; width: auto; border-radius: 2px; box-shadow: 0 1px 3px rgba(0,0,0,.35); }

.dice { display: flex; gap: 8px; justify-content: center; margin: 4px 0 10px; }
.die { width: 46px; height: 46px; border-radius: 9px; background: #fff; border: 2px solid var(--ink); display: grid; grid-template: repeat(3, 1fr) / repeat(3, 1fr); padding: 6px; box-sizing: border-box; box-shadow: 0 2px 0 var(--ink); }
.die i { width: 8px; height: 8px; border-radius: 50%; background: var(--ink); place-self: center; visibility: hidden; }
.die i.on { visibility: visible; }
.die.roll { animation: shake .5s ease-in-out; }
@keyframes shake { 20% { transform: rotate(-14deg) translateY(-4px); } 50% { transform: rotate(12deg); } 80% { transform: rotate(-5deg); } }

.optlist { display: flex; flex-direction: column; gap: 6px; }
.optlist button { display: flex; align-items: center; gap: 10px; text-align: left; border: 2px solid var(--paper-3); background: #fbf7ec; border-radius: 8px; padding: 8px 10px; font-family: var(--f-ui); font-size: 16px; }
.optlist button .k { width: 26px; height: 26px; border-radius: 50%; background: #ffd66b; border: 2px solid #c08a00; display: grid; place-items: center; font-weight: 700; flex: none; }
.optlist button .cost { margin-left: auto; color: var(--stamp); font-weight: 700; white-space: nowrap; }
.optlist button .cost.free { color: var(--ok); }

.cardrow { display: flex; gap: 12px; align-items: flex-start; }
.cardrow img.card { width: 96px; border-radius: 6px; box-shadow: 0 3px 10px rgba(0,0,0,.3); flex: none; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; font-family: var(--f-ui); font-size: 16px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; font-weight: 600; text-align: right; }

.thinking { display: flex; align-items: center; gap: 10px; font-family: var(--f-ui); font-size: 17px; }
.spinner { width: 22px; height: 22px; border: 3px solid var(--paper-3); border-top-color: var(--stamp); border-radius: 50%; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ---------- listy (sheety) ---------- */
.sheet-bg { position: fixed; inset: 0; background: rgba(10,16,32,.55); z-index: 50; display: flex; align-items: flex-end; justify-content: center; }
.sheet { width: 100%; max-width: 640px; max-height: 88%; background: var(--paper); border-radius: 14px 14px 0 0; display: flex; flex-direction: column;
  padding-bottom: env(safe-area-inset-bottom, 0px); animation: up .22s ease-out; }
@keyframes up { from { transform: translateY(40px); opacity: .4; } }
.sheet header { display: flex; align-items: center; gap: 10px; padding: 14px max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px)); border-bottom: 2px solid var(--paper-3); }
.sheet header h3 { margin: 0; flex: 1; font-family: var(--f-display); font-weight: 400; font-size: 20px; color: var(--ink); }
.sheet .body { overflow-y: auto; padding: 12px max(16px, env(safe-area-inset-right, 0px)) 18px max(16px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 10px; }
.sheet .close { border: 0; background: var(--paper-2); border-radius: 50%; width: 36px; height: 36px; font-size: 20px; }
.tabs { display: flex; gap: 6px; }
.tabs button { flex: 1; border: 0; border-radius: 8px; padding: 8px; font-family: var(--f-ui); font-size: 16px; font-weight: 600; background: var(--paper-2); color: var(--ink); }
.tabs button[aria-selected="true"] { background: var(--ink); color: var(--paper); }

.item { display: flex; gap: 12px; align-items: center; background: #fbf7ec; border: 1px solid var(--paper-3); border-radius: 10px; padding: 8px; }
.item img { width: 86px; border-radius: 5px; flex: none; box-shadow: 0 1px 4px rgba(0,0,0,.25); }
.item img.tall { width: 54px; }
.item .t { flex: 1; min-width: 0; }
.item .t b { font-family: var(--f-ui); font-size: 17px; display: block; color: var(--ink); }
.item .t p { margin: 2px 0 6px; font-size: 13px; color: var(--muted); line-height: 1.3; }
.item .t .acts { display: flex; gap: 6px; flex-wrap: wrap; }
.item .t .acts button { border: 0; border-radius: 6px; padding: 6px 10px; background: var(--ink); color: var(--paper); font-family: var(--f-ui); font-size: 14.5px; font-weight: 600; }
.item .t .acts button.alt { background: var(--paper-2); color: var(--ink); }
.item .t .acts button:disabled { opacity: .4; }
.tag { display: inline-block; font-family: var(--f-ui); font-size: 13px; padding: 1px 7px; border-radius: 10px; background: var(--paper-2); color: var(--ink); margin-right: 4px; }
.tag.red { background: var(--stamp); color: #fff; }
.err { color: var(--stamp); font-size: 13px; font-family: var(--f-ui); }
.note { font-size: 13.5px; color: var(--muted); line-height: 1.4; }
.sec { font-family: var(--f-ui); text-transform: uppercase; letter-spacing: 1.2px; font-size: 13px; color: var(--muted); margin: 6px 0 -2px; }

/* ---------- toasty ---------- */
#toasts { position: fixed; left: 50%; top: calc(env(safe-area-inset-top, 0px) + 112px); transform: translateX(-50%); z-index: 60; display: flex; flex-direction: column; gap: 6px; align-items: center; pointer-events: none; width: min(92vw, 460px); }
.toast { background: rgba(20,32,59,.94); color: var(--paper); padding: 8px 12px; border-radius: 8px; font-family: var(--f-ui); font-size: 15.5px; box-shadow: 0 4px 14px rgba(0,0,0,.3); animation: tin .2s ease-out; max-width: 100%; }
.toast.minus { border-left: 5px solid var(--stamp); }
.toast.plus { border-left: 5px solid #5cc57a; }
@keyframes tin { from { opacity: 0; transform: translateY(-8px); } }
.flybill { position: fixed; height: 30px; width: auto; z-index: 70; pointer-events: none; box-shadow: 0 2px 6px rgba(0,0,0,.4); border-radius: 2px; }

/* ---------- úvodní obrazovka ---------- */
#setup { position: fixed; inset: 0; overflow-y: auto; background: var(--ink); z-index: 40;
  padding: calc(env(safe-area-inset-top, 0px) + 16px) max(16px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 24px) max(16px, env(safe-area-inset-left, 0px)); }
.hero { max-width: 560px; margin: 0 auto 16px; border-radius: 12px; overflow: hidden; background: var(--paper); border: 3px solid var(--paper); padding: 10px 12px; box-sizing: border-box; }
.hero img { display: block; width: 100%; height: auto; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.hero-wrap { max-width: 560px; margin: 0 auto; }
.setup-card { max-width: 560px; margin: 0 auto; background: var(--paper); border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.setup-card h1 { margin: 0; font-family: var(--f-display); font-weight: 400; font-size: 26px; color: var(--ink); line-height: 1.1; text-wrap: balance; }
.setup-card .lead { margin: -4px 0 0; color: var(--muted); font-size: 14.5px; }
.prow { display: flex; align-items: center; gap: 8px; }
.prow input { flex: 1; min-width: 0; border: 2px solid var(--paper-3); border-radius: 8px; padding: 9px 10px; font: 16px var(--f-body); background: #fffdf7; color: var(--text); }
.seg { display: flex; border: 2px solid var(--ink); border-radius: 8px; overflow: hidden; flex: none; }
.seg button { border: 0; background: transparent; padding: 8px 10px; font-family: var(--f-ui); font-size: 15px; font-weight: 600; color: var(--ink); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.rm { border: 0; background: transparent; font-size: 22px; color: var(--muted); width: 32px; }
select { border: 2px solid var(--paper-3); border-radius: 8px; padding: 9px; font: 16px var(--f-body); background: #fffdf7; color: var(--text); }
label.fl { display: flex; flex-direction: column; gap: 4px; font-family: var(--f-ui); font-size: 15px; color: var(--muted); }

/* výsledná obrazovka */
.winner { text-align: center; padding: 10px 0; }
.winner h2 { font-family: var(--f-display); font-weight: 400; font-size: 30px; margin: 6px 0; color: var(--ink); }

.rules h4 { font-family: var(--f-ui); font-size: 17px; margin: 8px 0 2px; color: var(--ink); }
.rules p, .rules li { font-size: 14.5px; line-height: 1.45; }
.rules ul { padding-left: 18px; margin: 4px 0; }

/* plovoucí panel vpravo dole: počítač a telefon na šířku */
@media (min-width: 900px), (orientation: landscape) and (max-height: 600px) {
  #panel { position: absolute; right: max(10px, env(safe-area-inset-right, 0px)); bottom: max(10px, env(safe-area-inset-bottom, 0px)); width: 380px; max-width: 46vw; max-height: 70vh; border: 3px solid var(--ink); border-radius: 12px; z-index: 5; }
  #panel::before { display: none; }
  #panel .ptoggle { display: grid; }
  #panel.mini { width: auto; max-width: 60vw; padding-top: 6px; padding-bottom: 6px; }
  #panel.mini > :not(.ph):not(.ptoggle) { display: none !important; }
  #panel.mini .ph { margin: 0; padding-right: 40px; }
  #panel.mini .ph .sub { display: none; }
}
@media (orientation: landscape) and (max-height: 600px) {
  #topbar { padding-top: 3px; padding-bottom: 3px; }
  .chip { padding: 2px 8px 2px 4px; }
  .chip .star-badge, #topbar .star-badge { width: 20px; height: 20px; }
  .iconbtn { width: 36px; }
  #panel { width: 330px; max-height: calc(100% - 20px); padding: 8px 12px 10px; }
  .ph { margin-bottom: 6px; padding-right: 40px; }
  .ph h2 { font-size: 18px; }
  .ph .star-badge { width: 26px; height: 26px; }
  .wallet { margin-bottom: 6px; }
  .wallet .amt { font-size: 21px; }
  .bills { height: 30px; } .bills img { height: 28px; }
  .dicesel { margin: 0 0 6px; } .dicesel button { padding: 3px 2px; } .dicesel b { font-size: 15px; }
  .btn { min-height: 40px; padding: 8px 10px; font-size: 16px; }
  .btn.big { min-height: 46px; font-size: 18px; }
  .optlist button { padding: 6px 8px; font-size: 15px; }
  .cardrow img.card { width: 70px; }
  .die { width: 38px; height: 38px; }
  .mapctl { top: 8px; flex-direction: row; }
  .mapctl button { width: 36px; height: 36px; }
  #steps { top: 62px; }
  #panel { max-height: calc(100% - 64px); }
}
.ptoggle { display: none; position: absolute; top: 6px; right: 6px; width: 34px; height: 34px; border: 0; border-radius: 8px; background: var(--paper-2); color: var(--ink); place-items: center; font-size: 20px; font-weight: 700; line-height: 1; }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
}

.colorbtn { border: 2px solid var(--paper-3); background: #fffdf7; border-radius: 50%; width: 46px; height: 46px; display: grid; place-items: center; padding: 0; flex: none; }
.colorgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; }
.colorpick { display: flex; flex-direction: column; align-items: center; gap: 2px; border: 2px solid var(--paper-3); background: #fbf7ec; border-radius: 10px; padding: 10px 4px; font-family: var(--f-ui); }
.colorpick b { font-size: 16px; color: var(--ink); }
.colorpick small { font-size: 13px; color: var(--muted); }
.colorpick[aria-pressed="true"] { border-color: var(--ink); background: var(--paper-2); }

.levelseg { display: flex; width: 100%; }
.levelseg button { flex: 1; padding: 10px 6px; font-size: 16px; }

.betabar { display: flex; gap: 10px; align-items: center; background: #ffd66b; color: var(--ink); border-radius: 8px; padding: 8px 10px; font-size: 13.5px; line-height: 1.3; }
.betabar b { font-family: var(--f-display); font-weight: 400; font-size: 18px; letter-spacing: 1px; }
.crow { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; border-bottom: 1px solid var(--paper-3); padding: 4px 0; }
.clab { flex: 1 1 140px; min-width: 0; font-family: var(--f-ui); font-size: 15px; }
.csub { font-family: var(--f-ui); font-size: 13px; color: var(--muted); }
.cinp { width: 92px; border: 2px solid var(--paper-3); border-radius: 6px; padding: 6px; font: 15px var(--f-body); background: #fffdf7; color: var(--text); font-variant-numeric: tabular-nums; }

.cfield { display: inline-flex; flex-direction: column; align-items: flex-start; }
.cfield small { font-size: 11px; color: var(--muted); font-family: var(--f-ui); }
.cinp.changed { border-color: var(--gold); background: #fff3cf; }

.ctog { display: flex; gap: 10px; align-items: flex-start; font-size: 14.5px; padding: 4px 0; }
.ctog input { width: 20px; height: 20px; flex: none; margin-top: 1px; accent-color: var(--ink); }

.statecard { position: relative; display: inline-block; flex: none; container-type: inline-size; line-height: 0; }
.statecard img { width: 100%; display: block; border-radius: 0; box-shadow: none; max-width: none; }
.statecard.card { width: 96px; border-radius: 6px; box-shadow: 0 3px 10px rgba(0,0,0,.3); overflow: hidden; }
.statecard.tall { width: 54px; border-radius: 5px; box-shadow: 0 1px 4px rgba(0,0,0,.25); overflow: hidden; }
.statecard .band { position: absolute; left: 0; right: 0; top: 75%; bottom: 1.4%; background: #981f16; display: flex; flex-direction: column; justify-content: center; padding: 0 5% 0 7%; line-height: 1.12; color: #fff; font-family: 'Segoe UI', 'Selawik', system-ui, sans-serif; }
.statecard .band .r { display: flex; justify-content: space-between; font-size: 8.5cqw; }
.statecard .band .r.big { font-size: 9.6cqw; margin-bottom: 1.5cqw; }
.statecard .band i { font-style: normal; }
.statecard .band b { font-weight: 400; font-variant-numeric: tabular-nums; }

.manual { display: flex; flex-direction: column; gap: 6px; }
.mtoc { display: flex; flex-wrap: wrap; gap: 6px; padding-bottom: 6px; border-bottom: 2px solid var(--paper-3); }
.mtoc button { border: 0; border-radius: 14px; background: var(--paper-2); color: var(--ink); font-family: var(--f-ui); font-size: 14px; font-weight: 600; padding: 5px 10px; }
.msec { scroll-margin-top: 8px; }
.msec h3 { font-family: var(--f-display); font-weight: 400; font-size: 19px; color: var(--ink); margin: 14px 0 4px; }
.msec p, .msec li { font-size: 14.5px; line-height: 1.5; margin: 4px 0; }
.msec ul { padding-left: 18px; margin: 4px 0; }
.mex { background: #fff6dc; border-left: 4px solid var(--gold); border-radius: 6px; padding: 6px 10px; margin: 6px 0; }
.mex b { font-family: var(--f-ui); font-size: 14px; color: var(--ink); }
.mex p { margin: 2px 0 0; }
.mcard { display: flex; gap: 12px; align-items: flex-start; background: #fbf7ec; border: 1px solid var(--paper-3); border-radius: 10px; padding: 8px; margin: 6px 0; }
.mcard img { width: 120px; flex: none; border-radius: 6px; box-shadow: 0 2px 6px rgba(0,0,0,.25); }
.mcard > div { min-width: 0; }
.mcard > div > b { font-family: var(--f-ui); font-size: 17px; color: var(--ink); margin-right: 6px; }
.mcard p { margin: 4px 0 0; font-size: 14px; line-height: 1.45; }
.mrow { display: flex; gap: 10px; flex-wrap: wrap; margin: 6px 0; }
@media (max-width: 420px) { .mcard img { width: 96px; } }
/* online lobby */
.codebox{display:flex;flex-direction:column;align-items:center;gap:2px;padding:12px;border:2px dashed var(--paper-3);border-radius:12px;background:#fffaf0}
.codebox small{font-size:13px;color:var(--ink-2,#555);text-transform:uppercase;letter-spacing:.08em}
.codebox b{font:700 42px/1 var(--f-display,var(--f-body));letter-spacing:.18em;color:var(--navy,#14203b)}
.lobbylist{display:flex;flex-direction:column;gap:6px}
.lobbyrow{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;background:#fffaf0;border:1px solid var(--paper-3)}
.lobbyrow b{flex:1;font-size:16px}
.lobbyrow.free{opacity:.7;border-style:dashed}
.lobbyrow .tag{font-size:13px}
.codeinp{border:2px solid var(--paper-3);border-radius:8px;padding:10px;font:700 24px var(--f-body);letter-spacing:.2em;text-transform:uppercase;text-align:center}
.codeinp.name{font:16px var(--f-body);letter-spacing:0;text-transform:none;text-align:left}
.sheet .col{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.gonebox{display:flex;flex-direction:column;gap:8px;padding:12px;border-radius:12px;background:#fff3d6;border:2px solid #e6b44a}
.gonebox p{margin:0;font-size:15px}
</style>

    { id: 'red', name: 'Červená', hex: '#e0262b' },
    { id: 'yellow', name: 'Žlutá', hex: '#f5d50f' },
    { id: 'green', name: 'Zelená', hex: '#1f7a3a' },
    { id: 'blue', name: 'Modrá', hex: '#2370c4' },
    { id: 'purple', name: 'Fialová', hex: '#7a2f9e' },
    { id: 'black', name: 'Černá', hex: '#1d1d1f' },
    { id: 'white', name: 'Bílá', hex: '#f4f4f2' },
  ];
  const LABELS = {
    double: { name: 'Double Label', price: 10000, count: 4, img: 'double-label', desc: 'Zdvojnásobí mýtné za průjezd i zastavení v označeném státě.' },
    special: { name: 'Special Label', price: 15000, count: 4, img: 'special-label', desc: 'Kdo v označeném státě zastaví, zaplatí navíc hodnotu svého hodu × 1 000 $.' },
    independent: { name: 'Independent Label', price: 30000, count: 4, img: 'independent-label', desc: 'Ostatní hráči nesmí státem projet (kromě držitele Federal Highways).' },
  };
  // speciální karty (California je karta státu, řeší se zvlášť)
  const CARDS = {
    sea: { name: 'Sea Lines', price: 20000, img: 'sea-lines', desc: 'Lodní linky zdarma; ostatní platí poplatek za lodní trasy vám.' },
    air: { name: 'Air Lines', price: 40000, img: 'air-lines', desc: 'Letecké linky zdarma; ostatní platí poplatek za lety vám.' },
    chief: { name: 'Chief', price: 150000, deposit: 50000, img: 'chief', rent: true, desc: 'Zdvojnásobí mýtné a zisk v BC (kromě FED). Lze si ji zapůjčit za vratnou jistinu, nebo koupit.' },
    commander: { name: 'Commander', price: 500000, deposit: 250000, img: 'commander', rent: true, desc: 'Zčtyřnásobí mýtné a zisk v BC (kromě FED). Zápůjčka za vratnou jistinu 250 000 $, koupě 500 000 $.' },
    snb: { name: 'Second National Bank', price: 50000, fed: 15000, img: 'second-national-bank', desc: 'Třetí banka ve vašem státě: ostatní zde inkasují od vás 1 000 $ za každý svůj stát. Ve FED dostáváte 15 000 $.' },
    fedhw: { name: 'Federal Highways', price: 150000, img: 'federal-highways', desc: 'Smíte projíždět státy se značkou Independent Label.' },
    freemove: { name: 'Free Movement', price: 300000, img: 'free-movement', desc: 'Smíte během jízdy měnit směr. Do banky se ale nesmíte vrátit stejnou cestou.' },
    mafia: { name: 'Mafia', price: 400000, img: 'mafia', onlyFED: true, desc: 'Zápůjčka na jednu jízdu (do návratu do FED). Hráče, se kterým se na trase zkřížíte, vyřadíte ze hry. Platí se jen na políčku banky FED, peníze se nevrací.' },
    sh10: { name: 'Shareholder 10 %', price: 30000, img: 'shareholder-10', pct: 10, desc: '10% sleva na speciální karty a 10% podíl z každého prodeje speciální karty ostatním.' },
    sh20a: { name: 'Shareholder 20 %', price: 60000, img: 'shareholder-20a', pct: 20, desc: '20% sleva na speciální karty a 20% podíl z každého prodeje speciální karty ostatním.' },
    sh20b: { name: 'Shareholder 20 %', price: 60000, img: 'shareholder-20b', pct: 20, desc: '20% sleva na speciální karty a 20% podíl z každého prodeje speciální karty ostatním.' },
  };
  const SH = ['sh10', 'sh20a', 'sh20b'];

  function rnd(n) { return 1 + Math.floor(Math.random() * n); }
  const nodeState = n => N[n].s || null;
  const edgeKey = e => e;

  // ---------- vytvoření hry ----------
  function newGame(players, opts) {
    opts = opts || {};
    const g = {
      v: 1,
      opts: { targetCash: opts.targetCash || 0, targetStates: opts.targetStates || 0 },
      turn: 1,
      cur: 0,
      players: players.map((p, i) => ({
        id: i, name: p.name, color: p.color || COLORS[i].id, ai: !!p.ai, level: p.level || 1,
        cash: CONF.startCash, node: FED, alive: true,
        trip: { from: FED, used: [] }, prevEdge: null,
        circuit: 0, rerollUsed: false, bonusBC: false, bonusFED: false,
        diceN: 2, paid: {},        // paid: cena zaplacená za karty (pro prodej bance)
      })),
      states: {},                  // stát -> {owner, legal, label}
      cards: {},                   // karta -> {owner, mode:'own'|'rent', deposit}
      labelsLeft: { double: 4, special: 4, independent: 4 },
      snb: null,                   // stát, kde stojí Second National Bank
      debts: [],                   // {p, to, amt, why}
      pending: null,
      move: null,
      log: [],
      winner: null,
    };
    Object.keys(D.states).forEach(s => { g.states[s] = { owner: -1, legal: false, label: null }; });
    g.pending = { type: 'start', p: 0 };
    return g;
  }

  // ---------- pomocné ----------
  function P(g, i) { return g.players[i]; }
  function alive(g) { return g.players.filter(p => p.alive); }
  function ownedStates(g, i) { return Object.keys(g.states).filter(s => g.states[s].owner === i); }
  function hasCard(g, i, c) { return g.cards[c] && g.cards[c].owner === i; }
  function cardOwner(g, c) { return g.cards[c] ? g.cards[c].owner : -1; }
  function caliOwner(g) { return g.states.California.owner; }
  function shareholderPct(g, i) { return SH.reduce((s, c) => s + (hasCard(g, i, c) ? CARDS[c].pct : 0), 0); }
  function tollMult(g, owner, state) {
    let m = 1;
    if (state && g.states[state].label === 'double') m *= 2;
    return m * cardMult(g, owner);
  }
  function multTxt(g, owner, state) {
    const parts = [];
    if (state && g.states[state].label === 'double') parts.push('Double ×2');
    const a = hasCard(g, owner, 'chief'), b = hasCard(g, owner, 'commander');
    if (a && b && CONF.stack !== 'mul') parts.push(`Chief + Commander ×${cardMult(g, owner)}`);
    else { if (a) parts.push('Chief ×2'); if (b) parts.push('Commander ×4'); }
    return parts.length ? ` (${parts.join(', ')})` : '';
  }
  function profitMult(g, i) { return cardMult(g, i); }
  function fmt(n) { return (n < 0 ? '−' : '') + Math.abs(Math.round(n)).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ' ') + ' $'; }

  function ev(g, out, e) { out.push(e); if (e.text) { g.log.push({ turn: g.turn, text: e.text }); if (g.log.length > 200) g.log.shift(); } }

  // platba; to = -1 je banka. Když nemá dost, vznikne dluh.
  function pay(g, out, from, to, amt, why) {
    amt = Math.round(amt);
    if (amt <= 0 || from === to) return;
    if (from === -1) { P(g, to).cash += amt; ev(g, out, { t: 'pay', from, to, amt, why }); return; }
    const pf = P(g, from);
    if (!pf.alive) return;
    const give = Math.max(0, Math.min(pf.cash, amt));
    pf.cash -= give;
    if (to >= 0 && P(g, to).alive) P(g, to).cash += give;
    ev(g, out, { t: 'pay', from, to, amt: give, why, owed: amt - give });
    if (amt > give) g.debts.push({ p: from, to, amt: amt - give, why });
  }

  // ---------- pohyb ----------
  function blockedFor(g, i, v, fromNode) {
    const s = nodeState(v);
    if (!s) return false;
    const st = g.states[s];
    if (st.label !== 'independent' || st.owner === i || st.owner < 0) return false;
    if (hasCard(g, i, 'fedhw')) return false;
    if (nodeState(fromNode) === s) return false; // už je uvnitř
    return true;
  }
  function chainFee(g, i, u, v) {
    if (!(v in CHAIN_OF) || (u in CHAIN_OF && CHAIN_OF[u] === CHAIN_OF[v])) return null;
    const c = D.chains[CHAIN_OF[v]];
    const ownerCard = c.kind === 'air' ? 'air' : c.kind === 'sea' ? 'sea' : null;
    let owner = ownerCard ? cardOwner(g, ownerCard) : caliOwner(g);
    if (owner >= 0 && !P(g, owner).alive) owner = -1;
    if (owner === i) return { amt: 0, to: i, kind: c.kind };
    return { amt: c.price, to: owner, kind: c.kind };
  }
  // průjezdné mýtné za překročení hranice u->v
  function crossToll(g, i, u, v) {
    const su = nodeState(u), sv = nodeState(v);
    if (su === sv) return [];
    const res = [];
    [su, sv].forEach(s => {
      if (!s) return;
      const st = g.states[s];
      if (st.owner >= 0 && st.owner !== i && st.legal && P(g, st.owner).alive)
        res.push({ to: st.owner, amt: 1000 * tollMult(g, st.owner, s), state: s, exit: s === su });
    });
    return res;
  }
  function moveOptions(g, i) {
    const p = P(g, i), u = p.node;
    const free = hasCard(g, i, 'freemove');
    const used = new Set(p.trip.used);
    let opts = ADJ[u].filter(a => {
      if (blockedFor(g, i, a.v, u)) return false;
      if (used.has(a.e)) {
        if (!free) return false;
        if (a.v === p.trip.from && (a.v === FED || a.v === BC)) return false;
      }
      return true;
    });
    // do placené trasy nevjíždět, pokud všechny její konce vedou do zakázaného státu
    opts = opts.filter(a => {
      if (!(a.v in CHAIN_OF) || (u in CHAIN_OF && CHAIN_OF[u] === CHAIN_OF[a.v])) return true;
      const c = D.chains[CHAIN_OF[a.v]];
      return c.ends.some(en => en !== u && !blockedFor(g, i, en, a.v));
    });
    // nevjíždět do slepé uličky: po kroku musí existovat cesta do banky bez otáčení,
    // bez už projetých úseků a bez státu se značkou Independent
    const fin = opts.filter(a => canFinishTrip(g, i, u, a.v, a.e, used));
    if (fin.length) opts = fin;
    if (!opts.length) opts = ADJ[u].filter(a => !blockedFor(g, i, a.v, u) && !(a.e === p.prevEdge && ADJ[u].length > 1));
    if (!opts.length) opts = ADJ[u].filter(a => !blockedFor(g, i, a.v, u));
    if (!opts.length) opts = ADJ[u].slice();
    let res = opts.map(a => {
      const fee = chainFee(g, i, u, a.v);
      const tolls = crossToll(g, i, u, a.v);
      return { to: a.v, e: a.e, kind: a.k, fee: fee ? fee.amt : 0, feeTo: fee ? fee.to : -1, toll: tolls.reduce((s, t) => s + t.amt, 0) };
    });
    // placenou trasu nelze použít bez peněz na jízdenku (pokud existuje jiná možnost)
    const afford = res.filter(o => o.fee <= p.cash);
    if (afford.length) res = afford;
    return res;
  }

  function isBankFor(g, i, v, u) {
    if (v === FED || v === BC) return true;
    if (g.snb) { const sv = nodeState(v); if (sv === g.snb && nodeState(u) !== sv) { const h = cardOwner(g, 'snb'); if (h >= 0 && h !== i && P(g, h).alive && g.states[sv].owner === h) return true; } }
    return false;
  }
  // lze z oblouku u->v (hrana e) dojet do některé banky bez otočení a bez použitých úseků?
  function canFinishTrip(g, i, u, v, e, used) {
    if (isBankFor(g, i, v, u)) return true;
    const seen = new Set([e + ':' + v]);
    const q = [[v, e]];
    while (q.length) {
      const [n, inE] = q.shift();
      for (const a of ADJ[n]) {
        if (a.e === inE || used.has(a.e) || a.e === e) continue;
        if (blockedFor(g, i, a.v, n)) continue;
        if (isBankFor(g, i, a.v, n)) return true;
        const k = a.e + ':' + a.v;
        if (seen.has(k)) continue;
        seen.add(k); q.push([a.v, a.e]);
      }
    }
    return false;
  }

  function startTrip(p, bank) { p.trip = { from: bank, used: [] }; p.prevEdge = null; }

  function stepTo(g, out, i, opt) {
    const p = P(g, i), u = p.node, v = opt.to;
    const fee = chainFee(g, i, u, v);
    if (fee && fee.amt > 0) {
      const kindTxt = fee.kind === 'air' ? 'letecká linka' : fee.kind === 'sea' ? 'lodní linka' : 'zkratka';
      pay(g, out, i, fee.to, fee.amt, `Poplatek – ${kindTxt}`);
    }
    crossToll(g, i, u, v).forEach(t => pay(g, out, i, t.to, t.amt, `Mýtné ${t.exit ? 'výjezd ze státu' : 'vjezd do státu'} ${t.state}${multTxt(g, t.to, t.state)}`));
    p.trip.used.push(opt.e); p.prevEdge = opt.e;
    p.node = v;
    ev(g, out, { t: 'move', p: i, from: u, to: v });
    // mafie – zkřížení figurek
    mafiaCheck(g, out, i, v);
    if (!p.alive) return;
    // Second National Bank
    const sv = nodeState(v);
    if (g.snb && sv === g.snb && nodeState(u) !== sv) {
      const holder = cardOwner(g, 'snb');
      if (holder >= 0 && holder !== i && P(g, holder).alive && g.states[sv].owner === holder) {
        const cnt = ownedStates(g, i).length;
        ev(g, out, { t: 'bank', p: i, bank: 'SNB', text: `${p.name} projíždí Second National Bank (${sv}).` });
        if (cnt) pay(g, out, holder, i, 1000 * cnt, `Second National Bank – podíl za ${cnt} států`);
        startTrip(p, v);
      }
    }
  }

  function mafiaCheck(g, out, i, v) {
    const m = g.cards.mafia;
    if (!m || m.owner < 0) return;
    const holder = m.owner;
    if (!P(g, holder).alive || v === FED || v === BC) return;
    if (holder === i) {
      g.players.forEach(q => {
        if (q.id !== i && q.alive && q.node === v) eliminate(g, out, q.id, `${q.name} byl vyřazen Mafií hráče ${P(g, i).name}.`);
      });
    } else if (P(g, holder).node === v) {
      eliminate(g, out, i, `${P(g, i).name} zkřížil cestu Mafii hráče ${P(g, holder).name} a byl vyřazen.`);
    }
  }

  // ---------- banky ----------
  function arriveBank(g, out, i, bank) {
    const p = P(g, i);
    const items = [];
    if (bank === FED) {
      // legalizace
      const newly = ownedStates(g, i).filter(s => !g.states[s].legal);
      newly.forEach(s => { g.states[s].legal = true; });
      if (newly.length) ev(g, out, { t: 'legal', p: i, states: newly, text: `${p.name} legalizoval ${newly.length} ${newly.length === 1 ? 'stát' : newly.length < 5 ? 'státy' : 'států'}.` });
      if (!p.bonusFED) { p.bonusFED = true; items.push({ label: 'Bonus za první příjezd', amt: CONF.bonus }); }
      ownedStates(g, i).forEach(s => {
        if (s === 'California') items.push({ label: 'California (karta)', amt: D.states.California.fed });
        else if (D.states[s].fed) items.push({ label: s, amt: D.states[s].fed });
      });
      if (hasCard(g, i, 'snb')) items.push({ label: 'Second National Bank', amt: CARDS.snb.fed });
      const total = items.reduce((s, x) => s + x.amt, 0);
      ev(g, out, { t: 'bank', p: i, bank: 'FED', items, total, text: `${p.name} dorazil do banky FED (New York) a inkasuje ${fmt(total)}.` });
      if (total) pay(g, out, -1, i, total, 'Výplata banky FED');
      // vrácení Mafie
      if (hasCard(g, i, 'mafia')) { delete g.cards.mafia; ev(g, out, { t: 'msg', text: `${p.name} vrací kartu Mafia.` }); }
      if (p.circuit === 1) p.circuit = 2;
    } else {
      if (!p.bonusBC) { p.bonusBC = true; items.push({ label: 'Bonus za první příjezd', amt: CONF.bonus }); }
      const co = caliOwner(g);
      const payer = co >= 0 && co !== i && P(g, co).alive ? co : -1;
      let sub = 0;
      if (co !== i) {
        const m = profitMult(g, i);
        ownedStates(g, i).forEach(s => { if (D.states[s].bc) { items.push({ label: s + (m > 1 ? ` ×${m}` : ''), amt: D.states[s].bc * m }); sub += D.states[s].bc * m; } });
      }
      const total = items.reduce((s, x) => s + x.amt, 0);
      ev(g, out, { t: 'bank', p: i, bank: 'BC', items, total, payer, text: co === i ? `${p.name} vlastní Californii – v Sacramentu nic neinkasuje.` : `${p.name} dorazil do banky BC (Sacramento) a inkasuje ${fmt(total)}${payer >= 0 ? ` (podíl vyplácí ${P(g, payer).name})` : ''}.` });
      const bonus = total - sub;
      if (bonus) pay(g, out, -1, i, bonus, 'Bonus BC');
      if (sub) {
        // s pravidlem bcBankMult platí majitel Californie jen základ, násobek doplácí banka
        const m = profitMult(g, i), base = CONF.bcBankMult && payer >= 0 ? Math.round(sub / m) : sub;
        if (payer >= 0) pay(g, out, payer, i, base, 'Výplata v BC (majitel Californie)'); else pay(g, out, -1, i, base, 'Výplata banky BC');
        if (sub > base) pay(g, out, -1, i, sub - base, 'Výplata banky BC (násobek Chief/Commander)');
      }
      if (p.circuit === 0) p.circuit = 1;
    }
    startTrip(p, bank);
  }

  // ---------- vyřazení ----------
  function releaseAssets(g, i) {
    Object.keys(g.states).forEach(s => {
      const st = g.states[s];
      if (st.owner === i) { if (st.label) g.labelsLeft[st.label]++; g.states[s] = { owner: -1, legal: false, label: null }; }
    });
    Object.keys(g.cards).forEach(c => { if (g.cards[c].owner === i) delete g.cards[c]; });
    if (g.snb && !g.cards.snb) g.snb = null;
  }
  function eliminate(g, out, i, text) {
    const p = P(g, i);
    if (!p.alive) return;
    p.alive = false; p.cash = 0;
    releaseAssets(g, i);
    g.debts = g.debts.filter(d => d.p !== i);
    ev(g, out, { t: 'elim', p: i, text });
    checkWin(g, out, true);
  }

  // ---------- nákupy ----------
  function canBuyState(g, i) {
    const p = P(g, i), s = nodeState(p.node);
    if (!s || !g.states[s] || g.states[s].owner >= 0) return null;
    if (p.node === FED) return null; // New York nelze koupit na políčku banky
    const price = D.states[s].price;
    return { state: s, price };
  }
  function buyState(g, out, i, s) {
    const p = P(g, i), price = D.states[s].price;
    if (p.cash < price) return false;
    p.cash -= price;
    g.states[s] = { owner: i, legal: false, label: null };
    ev(g, out, { t: 'buy', p: i, state: s, amt: price, text: price ? `${p.name} kupuje ${s} za ${fmt(price)}.` : `${p.name} získává ${s} zdarma.` });
    ev(g, out, { t: 'pay', from: i, to: -1, amt: price, why: 'Nákup státu ' + s, silent: true });
    return true;
  }

  function cardPriceFor(g, i, c) {
    const base = CARDS[c].price;
    const disc = shareholderPct(g, i);
    return Math.round(base * (100 - disc) / 100);
  }
  function shareholderPayouts(g, out, buyer, base) {
    SH.forEach(c => {
      const o = cardOwner(g, c);
      if (o >= 0 && o !== buyer && P(g, o).alive) pay(g, out, -1, o, base * CARDS[c].pct / 100, `Podíl ${CARDS[c].name} z prodeje karty`);
    });
  }
  // co může hráč s kartou udělat
  function cardActions(g, i, c) {
    const def = CARDS[c], cur = g.cards[c], p = P(g, i), res = [];
    if (!p.alive) return res;
    if (c === 'mafia') {
      if (!cur && p.node === FED && g.pending && g.pending.type === 'start' && g.pending.p === i)
        res.push({ act: 'rent', cost: cardPriceFor(g, i, c), label: 'Zapůjčit na jednu jízdu' });
      return res;
    }
    if (def.rent) {
      if (!cur) {
        res.push({ act: 'rent', cost: CONF.shDeposit ? Math.round(def.deposit * (100 - shareholderPct(g, i)) / 100) : def.deposit, label: 'Zapůjčit (jistina)' });
        res.push({ act: 'buy', cost: cardPriceFor(g, i, c), label: 'Koupit' });
      } else if (cur.owner === i && cur.mode === 'rent') {
        res.push({ act: 'buyout', cost: Math.max(0, cardPriceFor(g, i, c) - cur.deposit), label: 'Dokoupit' });
        res.push({ act: 'return', cost: -cur.deposit, label: 'Vrátit (jistina zpět)' });
      } else if (cur.owner !== i && cur.mode === 'rent') {
        res.push({ act: 'outbid', cost: cur.deposit + 10000, label: 'Přeplatit jistinu' });
        res.push({ act: 'buy', cost: cardPriceFor(g, i, c), label: 'Koupit' });
      }
      return res;
    }
    if (!cur) {
      if (c === 'snb' && !ownedStates(g, i).some(s => s !== 'New York' && s !== 'California')) return res;
      res.push({ act: 'buy', cost: cardPriceFor(g, i, c), label: 'Koupit' });
    }
    return res;
  }
  function cardAct(g, i, c, act, extra) {
    const out = [], p = P(g, i), def = CARDS[c];
    const opt = cardActions(g, i, c).find(o => o.act === act);
    if (!opt) return { ok: false, out, err: 'Tuto akci teď nelze provést.' };
    if (opt.cost > 0 && p.cash < opt.cost) return { ok: false, out, err: 'Nemáte dost peněz.' };
    const cur = g.cards[c];
    if (act === 'buy') {
      if (cur && cur.mode === 'rent' && cur.owner !== i) pay(g, out, -1, cur.owner, cur.deposit, `Vrácená jistina ${def.name}`);
      p.cash -= opt.cost; p.paid[c] = opt.cost;
      g.cards[c] = { owner: i, mode: 'own' };

      let score = d * 1.0 + o.toll / 1500 + (o.fee > 0 ? (o.fee > (p.cash - reserve(g, i)) * 0.3 ? 1000 : o.fee / 600) : 0);
      // levnější přes vlastní karty → fee už je 0
      const s = D.nodes[o.to].s;
      if (s && g.states[s].owner < 0 && D.states[s].price <= p.cash - reserve(g, i)) score -= 1.2;
      if (mafia) {
        const opp = g.players.filter(q => q.alive && q.id !== i).map(q => q.node);
        if (opp.length) { const dm = Math.min(...opp.map(n => distMap(g, i, n, new Set())[o.to])); if (dm < 1e9) score += dm * 0.6 - 3; }
      }
      // vyhnout se Mafii
      const mh = E.cardOwner(g, 'mafia');
      if (mh >= 0 && mh !== i && g.players[mh].node === o.to && !(o.to === FED || o.to === BC)) score += 1000;
      score += Math.random() * 0.3;
      if (score < bestScore) { bestScore = score; best = o; }
    }
    return best.to;
  }

  function wantState(g, i, s, price) {
    const p = g.players[i];
    if (s === 'California') return p.cash - price >= 15000;
    return p.cash - price >= reserve(g, i);
  }

  // akce na začátku tahu (nákupy karet, značky). Vrací pole popisů akcí, které se provedly.
  function startActions(g, i) {
    const p = g.players[i];
    const outs = [];
    const owned = E.ownedStates(g, i);
    const legal = owned.filter(s => g.states[s].legal);
    const tryCard = (c, act, cond, extra) => {
      if (!cond) return;
      const o = E.cardActions(g, i, c).find(x => x.act === act);
      if (!o || p.cash - o.cost < reserve(g, i) + 10000) return;
      const r = E.cardAct(g, i, c, act, extra);
      if (r.ok) outs.push(...r.out);
    };
    tryCard('sea', 'buy', p.cash > 90000);
    tryCard('air', 'buy', p.cash > 140000);
    tryCard('chief', 'rent', legal.length >= 5 && p.cash > 110000);
    tryCard('chief', 'buyout', p.cash > 350000);
    tryCard('commander', 'rent', legal.length >= 10 && p.cash > 450000);
    const othersIndep = Object.values(g.states).some(s => s.label === 'independent' && s.owner !== i && s.owner >= 0);
    tryCard('fedhw', 'buy', othersIndep && p.cash > 250000);
    for (const c of E.SH) tryCard(c, 'buy', p.cash > 220000);
    if (owned.length >= 7) {
      const cand = owned.filter(s => s !== 'New York' && s !== 'California').sort((a, b) => traffic(b) - traffic(a));
      if (cand.length) tryCard('snb', 'buy', p.cash > 150000, { state: cand[0] });
    }
    if (p.node === FED && p.cash > 900000 && g.players.filter(q => q.alive).length > 1) tryCard('mafia', 'rent', true);
    // značky
    if (p.cash > 70000) {
      const cand = legal.filter(s => !g.states[s].label).sort((a, b) => traffic(b) - traffic(a));
      for (const s of cand.slice(0, 2)) {
        const type = p.cash > 160000 && traffic(s) >= 3 ? 'special' : 'double';
        if (p.cash - LABELS[type].price < 50000) break;
        const r = E.placeLabel(g, i, type, s);
        if (r.ok) outs.push(...r.out);
      }
    }
    return outs;
  }
  const TRAFFIC = {};
  D.edges.forEach(([a, b]) => { [a, b].forEach(n => { const s = D.nodes[n].s; if (s) TRAFFIC[s] = (TRAFFIC[s] || 0) + 1; }); });
  function traffic(s) { return TRAFFIC[s] || 0; }

  function settleDebt(g, i) {
    // prodávej nejméně výnosné věci první
    const items = E.sellables(g, i).sort((a, b) => {
      const va = a.kind === 'state' ? (D.states[a.id].fed + D.states[a.id].bc) / Math.max(1, a.value) : 0.01;
      const vb = b.kind === 'state' ? (D.states[b.id].fed + D.states[b.id].bc) / Math.max(1, b.value) : 0.01;
      return va - vb;
    });
    if (!items.length) return E.bankrupt(g, i);
    return E.debtSell(g, i, items[0].kind, items[0].id);
  }

  // =====================================================================
  //  CHYTŘEJŠÍ POČÍTAČ – úroveň 2 (střední) a 3 (těžká)
  // =====================================================================
  const NN = D.nodes.length;
  const lvl = (g, i) => g.players[i].level || 1;
  const LEVEL = {
    2: { H: 2.5, gamma: 0.88, leafCap: 2500, cards: "basic", feeGuard: 20000 },
    3: { H: 3.5, gamma: 0.8, leafCap: 5000, cards: 'full', sh: 1, indep: 1, special: 1, mafia: 1, resBase: 1500, resPer: 500, chiefMin: 3, feeGuard: 25000 },
  };
  LEVEL[4] = Object.assign({}, LEVEL[3], { dp: 1, H: 3.5, cap0: 0.7, cap1: 0.6, cap2: 0.3, beta: 0.6, pStop: 1 / 7 });
  LEVEL[5] = Object.assign({}, LEVEL[4], { regime: 0, HS: 210, tIter: 3, cMul: 1 });
  const LVL = (g, i) => LEVEL[Math.min(5, Math.max(4, lvl(g, i)))];
  if (typeof process !== 'undefined' && process.env && process.env.AI_TUNE) Object.assign(LEVEL[5], JSON.parse(process.env.AI_TUNE));

  // dopravní vytížení států (betweenness na síti tras), 0..1
  const STATE_TRAFFIC = (function () {
    const bc = new Array(NN).fill(0);
    for (let s = 0; s < NN; s++) {
      const S = [], P = Array.from({ length: NN }, () => []), sigma = new Array(NN).fill(0), dist = new Array(NN).fill(-1);
      sigma[s] = 1; dist[s] = 0; const Q = [s];
      while (Q.length) { const v = Q.shift(); S.push(v); for (const a of ADJ[v]) { const w = a.v; if (dist[w] < 0) { dist[w] = dist[v] + 1; Q.push(w); } if (dist[w] === dist[v] + 1) { sigma[w] += sigma[v]; P[w].push(v); } } }
      const delta = new Array(NN).fill(0);
      while (S.length) { const w = S.pop(); for (const v of P[w]) delta[v] += sigma[v] / sigma[w] * (1 + delta[w]); if (w !== s) bc[w] += delta[w]; }
    }
    const st = {};
    D.nodes.forEach((n, k) => { if (n.s) st[n.s] = (st[n.s] || 0) + bc[k]; });
    const mx = Math.max(...Object.values(st));
    Object.keys(st).forEach(k => { st[k] /= mx; });
    return st;
  })();
  const trafficOf = s => STATE_TRAFFIC[s] || 0;

  function opponents(g, i) { return g.players.filter(q => q.alive && q.id !== i); }
  function foreignLegal(g, i) { return Object.values(g.states).filter(s => s.owner >= 0 && s.owner !== i && s.legal).length; }
  function reserve2(g, i) {
    const lv = lvl(g, i);
    const f = foreignLegal(g, i);
    return (lv >= 3 ? LEVEL[3].resBase : 3500) + f * (lv >= 3 ? LEVEL[3].resPer : 900);
  }
  function stopTollAt(g, i, node, roll) {
    const s = D.nodes[node].s;
    if (!s) return 0;
    const st = g.states[s];
    if (st.owner < 0 || st.owner === i || !st.legal || !g.players[st.owner].alive) return 0;
    const m = E.tollMult(g, st.owner, s);
    return 1000 * m + (st.label === 'special' ? (roll || 7) * 1000 * m : 0);
  }
  function payoutEst(g, i, bank) {
    const p = g.players[i];
    const own = E.ownedStates(g, i);
    let v = 0;
    if (bank === FED) {
      own.forEach(s => { v += s === 'California' ? D.states.California.fed : D.states[s].fed; });
      if (E.hasCard(g, i, 'snb')) v += E.CARDS.snb.fed;
      if (!p.bonusFED) v += 5000;
      if (lvl(g, i) >= 3) v += own.filter(s => !g.states[s].legal).length * 1500 * (1 + opponents(g, i).length * 0.3);
    } else {
      if (!p.bonusBC) v += 5000;
      if (E.caliOwner(g) !== i) { const m = E.profitMult(g, i); own.forEach(s => { v += D.states[s].bc * m; }); }
    }
    return v - stopTollAt(g, i, bank, 7);
  }
  function stateValue(g, i, s) {
    const L = LEVEL[lvl(g, i)];
    const ds = D.states[s];
    const nOpp = opponents(g, i).length;
    const m = E.profitMult(g, i);
    let inc = s === 'California' ? D.states.California.fed + 8000 * nOpp * 0.4 : ds.fed + (E.caliOwner(g) === i ? 0 : ds.bc * m);
    const toll = trafficOf(s) * nOpp * 2600 * (1 + (E.hasCard(g, i, 'chief') ? 1 : 0) + (E.hasCard(g, i, 'commander') ? 3 : 0));
    return inc * L.H + toll * L.H * 0.6 + 1500;
  }
  // „cena kroku" – kolik peněz má hodnotu jeden krok cesty
  function stepMoney(g, i) {
    const avg = (Math.max(0, payoutEst(g, i, FED)) + Math.max(0, payoutEst(g, i, BC))) / 2;
    return Math.max(700, avg / 9 + g.players[i].cash / 400);
  }
  // zpětný Dijkstra k bankám s vahou: krok + (jízdenky a mýtné) / cena kroku
  function bankDistances(g, i, usedSet, S) {
    const res = {};
    for (const bank of [FED, BC]) {
      const dist = new Array(NN).fill(Infinity), done = new Array(NN).fill(false);
      dist[bank] = 0;
      for (;;) {
        let u = -1, best = Infinity;
        for (let k = 0; k < NN; k++) if (!done[k] && dist[k] < best) { best = dist[k]; u = k; }
        if (u < 0) break;
        done[u] = true;
        for (const a of ADJ[u]) {           // hrana a.v -> u
          if (usedSet.has(a.e)) continue;
          const from = a.v;
          if (from === FED || from === BC) { if (from !== bank) continue; }
          if (E.blockedFor(g, i, u, from)) continue;
          const fee = E.chainFee(g, i, from, u);
          const tolls = E.crossToll(g, i, from, u).reduce((x, t) => x + t.amt, 0);
          const w = 1 + ((fee ? fee.amt : 0) + tolls) / S;
          if (dist[u] + w < dist[from]) dist[from] = dist[u] + w;
        }
      }
      res[bank] = dist;
    }
    return res;
  }

  // projde všechny cesty pro daný počet kroků (s dočasnou změnou stavu hráče)
  function enumPaths(g, i, steps, cap, cb) {
    const p = g.players[i];
    const save = { node: p.node, used: p.trip.used, prev: p.prevEdge, cash: p.cash };
    let leaves = 0;
    const path = [];
    const rec = (left, spent) => {
      if (leaves >= cap) return;
      const opts = E.moveOptions(g, i);
      for (const o of opts) {
        if (leaves >= cap) return;
        const n0 = p.node, pe0 = p.prevEdge, u0 = p.trip.used, c0 = p.cash;
        const cost = o.fee + o.toll;
        p.node = o.to; p.prevEdge = o.e; p.trip.used = u0.concat(o.e); p.cash = c0 - cost;
        path.push(o);
        const bank = o.to === FED || o.to === BC;
        if (left - 1 === 0 || bank) { leaves++; cb(path, spent + cost, bank); }
        else rec(left - 1, spent + cost);
        path.pop(); p.node = n0; p.prevEdge = pe0; p.trip.used = u0; p.cash = c0;
      }
    };
    try { rec(steps, 0); } finally { p.node = save.node; p.trip.used = save.used; p.prevEdge = save.prev; p.cash = save.cash; }
    return leaves;
  }

  // nejlepší plán pro „steps" kroků; vrací {value, first}
  function bestPlan(g, i, steps, roll) {
    const lv = lvl(g, i), L = LEVEL[lv], p = g.players[i];
    const S = stepMoney(g, i);
    const res = reserve2(g, i);
    const used0 = new Set(p.trip.used);
    const bd = bankDistances(g, i, used0, S);
    const pay = { [FED]: payoutEst(g, i, FED), [BC]: payoutEst(g, i, BC) };
    const NEXT = (Math.max(0, pay[FED]) + Math.max(0, pay[BC])) / 2;
    const mafiaHolder = E.cardOwner(g, 'mafia');
    const iAmMafia = mafiaHolder === i;
    const holderNode = mafiaHolder >= 0 && mafiaHolder !== i && g.players[mafiaHolder].alive ? g.players[mafiaHolder].node : -1;
    const oppNodes = iAmMafia ? opponents(g, i).map(q => q.node) : [];
    let best = { value: -Infinity, first: null };
    enumPaths(g, i, steps, L.leafCap, (path, spent, bank) => {
      const end = p.node;
      const cashAfter = p.cash;      // už ponížené o cestu
      let v = -spent;
      // mafie
      if (holderNode >= 0 && path.some(o => o.to === holderNode && o.to !== FED && o.to !== BC)) v -= 1e8;
      if (iAmMafia) v += path.filter(o => oppNodes.includes(o.to) && o.to !== FED && o.to !== BC).length * 400000;
      if (bank) {
        v += pay[end] + NEXT;
      } else {
        const stop = stopTollAt(g, i, end, roll);
        v -= stop;
        const s = D.nodes[end].s;
        if (s && g.states[s].owner < 0 && end !== FED) {
          const price = D.states[s].price;
          if (cashAfter - stop - price >= res * 0.6) v += stateValue(g, i, s);
          else if (cashAfter - stop >= price) v += stateValue(g, i, s) * 0.25;
        }
        // budoucnost: dojezd do banky (bez úseků už použitých na této cestě – přibližně přes sousedy)
        const usedNow = new Set(p.trip.used);
        let fut = -Infinity;
        for (const b of [FED, BC]) {
          let d = Infinity;
          for (const a of ADJ[end]) {
            if (usedNow.has(a.e)) continue;
            if (E.blockedFor(g, i, a.v, end)) continue;
            const fee = E.chainFee(g, i, end, a.v);
            const w = 1 + ((fee ? fee.amt : 0) + E.crossToll(g, i, end, a.v).reduce((x, t) => x + t.amt, 0)) / S;
            d = Math.min(d, w + bd[b][a.v]);
          }
          if (d === Infinity) continue;
          fut = Math.max(fut, (pay[b] + NEXT) * Math.pow(L.gamma, d / 7) - d * 120);
        }
        if (fut === -Infinity) fut = -40000;
        v += fut;
        // stát se Special/Double vlastníků na konci = drahé zastavení příště (výjezd)
        if (lv >= 3 && holderNode >= 0) {
          const dh = Math.abs(D.nodes[holderNode].x - D.nodes[end].x) + Math.abs(D.nodes[holderNode].y - D.nodes[end].y);
          if (dh < 260) v -= 60000 * (1 - dh / 260);
        }
      }
      const fg = lv >= 3 ? LEVEL[3].feeGuard : LEVEL[2].feeGuard || 0;
      if (fg && path.some(o => o.fee > 0) && cashAfter < fg) v -= (fg - cashAfter) * 3;
      if (cashAfter < 0) v -= 30000 + (-cashAfter) * 3;
      else if (cashAfter < res) v -= (res - cashAfter) * 1.2;
      v += Math.random() * 50;
      if (v > best.value) best = { value: v, first: path[0].to };
    });
    return best;
  }


  // ---------- plánování celých okruhů (úroveň 4) ----------
  // čistá hodnota koupě státu: výnos v bankách a z mýtného za zbytek hry minus „cena kapitálu"
  // ---- okruhy kolem banky FED (statický seznam nejkratších) ----
  const FED_LOOPS = (function () {
    const out = [], seen = new Set(), used = new Set(), path = [];
    let budget = 400000;
    const dfs = (n, len) => {
      if (len >= 26 || --budget < 0) return;
      for (const a of ADJ[n]) {
        if (used.has(a.e) || a.v === BC) continue;
        if (a.v === FED) {
          if (len >= 3) {
            const arcs = path.concat([[n, a.v]]);
            const key = arcs.map((x, k) => (k ? '' : '') + Math.min(x[0], x[1]) + '-' + Math.max(x[0], x[1])).sort().join('|');
            if (!seen.has(key)) { seen.add(key); out.push({ len: len + 1, arcs, nodes: arcs.map(x => x[1]).filter(v => v !== FED) }); }
          }
          continue;
        }
        used.add(a.e); path.push([n, a.v]); dfs(a.v, len + 1); path.pop(); used.delete(a.e);
      }
    };
    dfs(FED, 0);
    out.sort((a, b) => a.len - b.len);
    return out.slice(0, 40);
  })();
  const CROSS_LEN = (function () {
    const bfs = src => { const d = new Array(NN).fill(1e9); d[src] = 0; const q = [src]; while (q.length) { const u = q.shift(); for (const a of ADJ[u]) if (a.k === 'road' && d[a.v] > d[u] + 1) { d[a.v] = d[u] + 1; if (a.v !== FED && a.v !== BC) q.push(a.v); } } return d; };
    return bfs(FED)[BC] * 2 + 4;
  })();
  // výnos na krok pro nejlepší „režim" hry: okruh kolem FED, nebo jízda FED ⇄ BC
  function regimeRate(g, i, extra) {
    const own = new Set(E.ownedStates(g, i)); if (extra) own.add(extra);
    const m = E.profitMult(g, i);
    let fed = 0, bc = 0;
    own.forEach(s => { fed += s === 'California' ? D.states.California.fed : D.states[s].fed; bc += s === 'California' ? 0 : D.states[s].bc; });
    if (E.hasCard(g, i, 'snb')) fed += E.CARDS.snb.fed;
    if (E.caliOwner(g) === i || own.has('California')) bc = 0; else bc *= m;
    let best = (fed + bc) / CROSS_LEN;
    const nyStop = stopTollAt(g, i, FED, 7);
    for (const L of FED_LOOPS) {
      let cost = nyStop, stops = 0;
      for (const [u, v] of L.arcs) {
        const fee = E.chainFee(g, i, u, v);
        if (fee && fee.to !== i) cost += fee.amt;
        if (E.blockedFor(g, i, v, u)) { cost = Infinity; break; }
        cost += E.crossToll(g, i, u, v).reduce((x, t) => x + t.amt, 0);
      }
      if (cost === Infinity) continue;
      for (const n of L.nodes) stops += stopTollAt(g, i, n, 7);
      cost += stops / Math.max(1, L.nodes.length) * (L.len / 7);
      const r = (fed - cost) / L.len;
      if (r > best) best = r;
    }
    return best;
  }

  function netStateValue(g, i, s, baseRate) {
    const L = LVL(g, i), p = g.players[i];
    const ds = D.states[s];
    if (g.states[s].owner >= 0) return 0;
    const res = reserve2(g, i);
    if (ds.price > p.cash - res) return 0;
    const nOpp = opponents(g, i).length;
    const m = E.profitMult(g, i);
    const inc = s === 'California' ? D.states.California.fed + 6000 * nOpp * 0.4 : ds.fed * (L.wF || 1) + (E.caliOwner(g) === i ? 0 : ds.bc * m);
    const toll = trafficOf(s) * nOpp * 2400 * (L.wT || 1) * (1 + (E.hasCard(g, i, 'chief') ? 1 : 0) + (E.hasCard(g, i, 'commander') ? 3 : 0));
    const cap = p.cash < 40000 ? L.cap0 : p.cash < 150000 ? L.cap1 : L.cap2;
    if (L.regime) {
      const base = baseRate != null ? baseRate : regimeRate(g, i);
      const gain = Math.max(0, regimeRate(g, i, s) - base) * L.HS;
      return Math.max(0, gain + toll * L.H * 0.6 - ds.price * cap);
    }
    const NE = L.neBonus && NE_SET.has(s) ? L.neBonus : 1;
    return Math.max(0, (inc * L.H + toll * L.H * 0.6) * NE - ds.price * cap);
  }
  const NE_SET = new Set(['New York', 'Vermont', 'New Hampshire', 'Maine', 'Massachusetts', 'Rhode Island', 'Connecticut', 'Pennsylvania', 'New Jersey', 'Delaware', 'Maryland', 'Washington D.C.', 'Virginia', 'West Virginia']);
  const ARCS = D.edges.length * 2;           // oblouk = hrana + směr; hlava = cílový uzel
  const arcHead = a => { const [x, y] = D.edges[a >> 1]; return (a & 1) ? x : y; };
  const arcTail = a => { const [x, y] = D.edges[a >> 1]; return (a & 1) ? y : x; };
  const OUT = D.nodes.map(() => []);
  for (let a = 0; a < ARCS; a++) OUT[arcTail(a)].push(a);
  function arcOf(e, to) { return D.edges[e][1] === to ? e * 2 : e * 2 + 1; }

  function routeModel(g, i) {
    const L = LVL(g, i), p = g.players[i];
    const pay = { [FED]: payoutEst(g, i, FED), [BC]: payoutEst(g, i, BC) };
    const baseRate = L.regime ? regimeRate(g, i) : 0;
    const cStep = (L.regime && !L.cOld) ? Math.max(300, baseRate * (L.cMul || 1)) : Math.max(300, (Math.max(0, pay[FED]) + Math.max(0, pay[BC])) / 40 + 150);
    // ceny oblouků a odměny uzlů
    const arcCost = new Float64Array(ARCS), arcOk = new Uint8Array(ARCS), nodeR = new Float64Array(NN);
    for (let a = 0; a < ARCS; a++) {
      const u = arcTail(a), v = arcHead(a);
      if (E.blockedFor(g, i, v, u)) continue;
      const fee = E.chainFee(g, i, u, v);
      const tolls = E.crossToll(g, i, u, v).reduce((x, t) => x + t.amt, 0);
      arcCost[a] = (fee ? fee.amt : 0) + tolls + cStep; arcOk[a] = 1;
    }
    const seenState = {};
    for (let n = 0; n < NN; n++) {
      if (n === FED || n === BC) continue;
      const s = D.nodes[n].s;
      let r = -stopTollAt(g, i, n, 7);
      if (s) { if (!(s in seenState)) seenState[s] = netStateValue(g, i, s, L.regime ? baseRate : null); r += seenState[s]; }
      nodeR[n] = r * L.pStop;
    }
    const K = 70;
    const run = (usedSet, T) => {
      let V = new Float64Array(ARCS).fill(-Infinity);
      for (let k = 0; k < K; k++) {
        const W = new Float64Array(ARCS).fill(-Infinity);
        for (let a = 0; a < ARCS; a++) {
          if (!arcOk[a] || usedSet.has(a >> 1)) continue;
          const h = arcHead(a);
          if (h === FED || h === BC) continue;      // na banku se končí
          const back = a ^ 1;
          let best = -Infinity;
          for (const b of OUT[h]) {
            if (b === back || !arcOk[b] || usedSet.has(b >> 1)) continue;
            const t = arcHead(b);
            const val = -arcCost[b] + ((t === FED || t === BC) ? T[t] : nodeR[t] + V[b]);
            if (val > best) best = val;
          }
          W[a] = best;
        }
        V = W;
      }

    };

  // ============ mapa: posun a zoom ============

  let dragMoved = false;

  // který stát leží na daném místě mapy (souřadnice obrázku)
  function inPoly(f, x, y) {
    let c = false;
    for (let k = 0, j = f.length - 2; k < f.length; j = k, k += 2) {
      const xi = f[k], yi = f[k + 1], xj = f[j], yj = f[j + 1];
      if ((yi > y) !== (yj > y) && x < (xj - xi) * (y - yi) / (yj - yi) + xi) c = !c;
    }
    return c;
  }
  function stateAt(x, y) {
    if (x < 0 || y < 0 || x > IMG.w || y > IMG.h) return null;

    for (const s in P) { if (P[s].reduce((c, f) => c ^ inPoly(f, x, y), false)) return s; }

    let best = null, bd = Infinity;
    D.nodes.forEach((n, k) => { if (!n.s) return; const d = Math.hypot(px(k) - x, py(k) - y); if (d < bd) { bd = d; best = n.s; } });
    Object.keys(D.states).forEach(s => { const d = Math.hypot(lx(s) - x, ly(s) - y); if (d < bd) { bd = d; best = s; } });
    return bd < Math.max(120, 45 / view.s) ? best : null;
  }

  function compass(a, b) {

  }

  // ============ přehrání událostí ============
  function chipRect(i) {
    const el = i < 0 ? $('#menuBtn') : document.querySelector(`.chip[data-p="${i}"]`);
    return el ? el.getBoundingClientRect() : { left: innerWidth / 2, top: 40, width: 0, height: 0 };
  }
  function flyBills(from, to, amt) {
    if (!amt || fast) return;
    const a = chipRect(from), b = chipRect(to);
    billsFor(amt, 3).forEach((n, k) => {
      const img = h('img', { class: 'flybill', src: `bill-${n}.jpg`, alt: '' });
      document.body.append(img);
      const x0 = a.left + a.width / 2 - 35, y0 = a.top + a.height / 2, x1 = b.left + b.width / 2 - 35, y1 = b.top + b.height / 2;
      const an = img.animate([{ transform: `translate(${x0}px,${y0}px) rotate(-8deg)`, opacity: 0 }, { opacity: 1, offset: .15 }, { transform: `translate(${(x0 + x1) / 2}px,${Math.max(y0, y1) + 70}px) rotate(6deg)`, offset: .5 }, { transform: `translate(${x1}px,${y1}px) rotate(0)`, opacity: .2 }], { duration: 700, delay: k * 90, easing: 'ease-in-out', fill: 'forwards' });
      an.onfinish = () => img.remove();
    });
  }
  function toast(text, cls, ms) {
    const t = h('div', { class: 'toast ' + (cls || '') }, text);
    const box = $('#toasts');
    box.append(t);
    while (box.children.length > 4) box.firstChild.remove();
    setTimeout(() => t.remove(), (fast ? 0.6 : 1) * (ms || 2600));
  }
  async function play(out) {
    busy = true; drawOptions();
    if (out.some(e => e.t === 'move' || e.t === 'dice')) {
      $('#steps').hidden = true;
      const i = G.cur, P = $('#panel'); P.innerHTML = '';
      const d = out.find(e => e.t === 'dice');
      P.append(header(i, isMine(i) ? `${pl(i).name} jede…` : `Hraje ${pl(i).name}`, d ? `Hod ${d.dice.join(' + ')} = ${d.dice.reduce((a, b) => a + b, 0)}` : ''));
      if (d) { P.append(h('div', { class: 'dice' }, d.dice.map(v => dieEl(v, true)))); renderLastRoll(true); }
    }
    let moved = false;
    for (const e of out) {
      if (e.t === 'move') {
        if (trailPlayer !== e.p) { trailPlayer = e.p; lastTrail = [e.from]; }
        lastTrail.push(e.to);
        drawPawns(); drawTrail(); followNode(e.to); moved = true;
        await sleep(isMine(e.p) ? 170 : 210);
      } else if (e.t === 'dice') {
        toast(e.text, '', 2400);
        if (!isMine(e.p)) showNode(pl(e.p).node);
        await sleep(450);
        if (trailPlayer === e.p) lastTrail = [pl(e.p).node];
      } else if (e.t === 'pay') {
        if (e.silent || !e.amt) { if (e.owed) toast(`${pname(e.from)} nemá na platbu, dluží ${fmt(e.owed)}.`, 'minus'); continue; }
        const txt = e.to < 0 ? `${pname(e.from)} platí ${fmt(e.amt)} · ${e.why}` : e.from < 0 ? `${pname(e.to)} +${fmt(e.amt)} · ${e.why}` : `${pname(e.from)} → ${pname(e.to)}: ${fmt(e.amt)} · ${e.why}`;
        toast(txt, e.from < 0 ? 'plus' : 'minus');
        if (e.owed) toast(`${pname(e.from)} nemá na platbu, dluží ${fmt(e.owed)}.`, 'minus');
        renderChips(); flyBills(e.from, e.to, e.amt);
        await sleep(300);
      } else if (e.t === 'bank') {
        if (e.items && e.items.length && isMine(e.p)) await bankSheet(e);
        else toast(e.text, 'plus', 3200);
        await sleep(200);
      } else if (e.t === 'elim') {
        drawPawns(); drawMarks(); renderChips();
        await alertBox(e.text);
      } else if (e.t === 'win') {
        toast(e.text, 'plus', 5000);
      } else if (e.t === 'turn') {
        if (moved) await sleep(350);
        lastTrail = []; trailPlayer = -1; drawTrail();
      } else if (e.text) {
        toast(e.text, e.t === 'buy' || e.t === 'card' || e.t === 'label' ? '' : '', 2800);
        drawMarks(); renderChips();
        await sleep(e.t === 'buy' ? 380 : 200);
      }
    }
    busy = false;
  }

  // ============ hlavní smyčka ============
  async function doAction(fn) {
    if (busy) return;
    const r = fn();
    if (!r) return;
    if (!r.ok) { if (r.err) toast(r.err, 'minus'); return; }
    commit(r.out || []);
    await play(r.out || []);
    refresh();
  }
  function refresh() {
    save();
    renderChips(); drawMarks(); drawPawns(); drawTrail(); renderPanel(); drawOptions();
    const pd = G.pending;
    if (!pd || pd.type === 'over') return;
    if (ON && ON.host) setTimeout(hostPump, 0);
    if (ON && !ON.host) setTimeout(clientPump, 0);
    if (pd.type === 'dir' && isMine(pd.p)) focusNodes([pl(pd.p).node, ...pd.options.map(o => o.to)], view.min * 2.2);
    if (pd.type === 'start' && isMine(pd.p)) { diceN = 2; }
    if (!isHuman(pd.p) && (!ON || ON.host)) setTimeout(aiStep, fast ? 120 : 520);
  }
  async function aiStep() {
    if (busy || !G.pending || G.pending.type === 'over' || isHuman(G.pending.p) || (ON && !ON.host)) return;
    const r = AI.act(G);
    if (!r || !r.ok) { console.warn('AI nemůže pokračovat', G.pending, r); return; }
    commit(r.out || []);
    await play(r.out || []);
    refresh();
  }

  // ---------- obchod mezi hráči ----------
  // ---------- obchod ----------
  const tkey = (a, b) => Math.min(a, b) + '-' + Math.max(a, b);
  const tradeBlocked = (a, b) => !!(G.tradeBlock && G.tradeBlock[tkey(a, b)] === G.turn);
  const tdesc = side => [...(side.states || []), ...(side.cards || []).map(c => E.CARDS[c].name), side.cash ? fmt(side.cash) : null].filter(Boolean).join(', ') || 'nic';
  const flip = t => ({ a: t.b, b: t.a, give: t.get, get: t.give });
  // odmítnutí: obchod mezi dvojicí je možný až v dalším kole
  function declineTrade(t) { metaAct('tradeBlock', t.a, t.b); }
  // nabídka čeká na odpověď hráče t.b (na tomto zařízení)
  function offerSheet(t, onAnswer) {
    sheet(`${pl(t.b).name}, přijímáte obchod?`, (bb, cl2) => {
      bb.append(h('p', null, h('b', null, pl(t.a).name), ' nabízí: ', tdesc(t.give)), h('p', null, 'a chce od vás: ', tdesc(t.get)));
      if (!E.tradeValid(G, t)) bb.append(h('p', { class: 'err' }, 'Obchod už není platný (změnil se majetek nebo hotovost).'));
      bb.append(h('div', { class: 'col' },
        h('button', { class: 'btn red', disabled: !E.tradeValid(G, t), onclick: () => { cl2(); if (onAnswer) onAnswer('yes'); runSide(E.doTrade(G, t)); } }, 'Přijmout'),
        h('button', { class: 'btn soft', onclick: () => { cl2(); if (onAnswer) onAnswer('counter'); openTrade(t.b, { partner: t.a, preset: flip(t), counter: true }); } }, 'Odmítnout s protinávrhem'),
        h('button', { class: 'btn ghost', onclick: () => { cl2(); if (onAnswer) onAnswer('no'); declineTrade(t); toast('Obchod odmítnut. Další nabídka mezi vámi až v příštím kole.'); } }, 'Odmítnout')));
    });
  }
  // počítač odmítl – ukáže jeho protinávrhy
  function aiCounterSheet(t) {
    const cs = AI.counterTrade(G, t);
    sheet(`${pl(t.b).name}: protinávrh`, (b, close) => {
      b.append(h('p', { style: 'margin:0' }, cs.length ? 'Vaši nabídku odmítá, ale přijal by některou z těchto variant:' : 'Vaši nabídku odmítá a žádný protinávrh nemá.'));
      cs.forEach(c => {
        const ok = E.tradeValid(G, c.t);
        b.append(h('div', { class: 'item', style: 'display:block' },
          h('b', null, c.label),
          h('p', { style: 'margin:4px 0' }, `Dáte: ${tdesc(c.t.give)}`), h('p', { style: 'margin:0 0 6px' }, `Dostanete: ${tdesc(c.t.get)}`),
          h('button', { class: 'btn red', disabled: !ok, onclick: () => { close(); runSide(E.doTrade(G, c.t)); toast(`${pl(t.b).name} přijímá obchod.`, 'plus'); } }, 'Přijmout tuto variantu')));
      });
      b.append(h('button', { class: 'btn ghost', onclick: () => { close(); declineTrade(t); toast('Další obchod s tímto hráčem až v příštím kole.'); } }, 'Odmítnout'));
    });
  }
  function openTrade(i, o) {
    o = o || {};
    const others = G.players.filter(p => p.alive && p.id !== i);
    if (!others.length) return;
    const free = others.filter(p => !tradeBlocked(i, p.id));
    if (!free.length && !o.partner) { toast('S ostatními hráči lze obchodovat až v příštím kole.', 'minus'); return; }
    let b2 = o.partner != null ? o.partner : free[0].id;
    const mk = side => ({ states: new Set(side ? side.states || [] : []), cards: new Set(side ? side.cards || [] : []), cash: side ? side.cash || 0 : 0 });
    const sel = { give: mk(o.preset && o.preset.give), get: mk(o.preset && o.preset.get) };
    sheet(o.counter ? 'Protinávrh' : 'Obchod s hráčem', (b, close) => {
      const draw = () => {
        b.innerHTML = '';
        if (o.counter) b.append(h('p', { class: 'note', style: 'margin:0' }, `Upravte nabídku a pošlete ji zpět hráči ${pl(b2).name}.`));
        else {
          const ps = h('select', { id: 'tradePartner', 'aria-label': 'Partner', onchange: e => { b2 = +e.target.value; sel.get = mk(); draw(); } },
            others.map(p => h('option', { value: p.id, selected: p.id === b2, disabled: tradeBlocked(i, p.id) }, p.name + (p.ai ? ' (počítač)' : '') + (tradeBlocked(i, p.id) ? ' – až příští kolo' : ''))));
          b.append(h('label', { class: 'fl' }, 'Obchodní partner', ps));
        }
        const side = (who, key, title) => {
          const box = h('div', { style: 'display:flex;flex-direction:column;gap:6px' }, h('div', { class: 'sec' }, title));
          E.ownedStates(G, who).forEach(s => {
            const on = sel[key].states.has(s);
            box.append(h('button', { class: 'btn ' + (on ? '' : 'soft'), style: 'min-height:38px;padding:6px 10px;font-size:15px', onclick: () => { on ? sel[key].states.delete(s) : sel[key].states.add(s); draw(); } }, (on ? '✓ ' : '') + s + (G.states[s].label ? ' + ' + E.LABELS[G.states[s].label].name : '')));
          });
          Object.keys(G.cards).filter(c => G.cards[c].owner === who && G.cards[c].mode === 'own').forEach(c => {
            const on = sel[key].cards.has(c);
            box.append(h('button', { class: 'btn ' + (on ? '' : 'soft'), style: 'min-height:38px;padding:6px 10px;font-size:15px', onclick: () => { on ? sel[key].cards.delete(c) : sel[key].cards.add(c); draw(); } }, (on ? '✓ ' : '') + E.CARDS[c].name));
          });
          const inp = h('input', { id: 'cash-' + key, type: 'number', inputmode: 'numeric', min: 0, step: 500, max: pl(who).cash, value: sel[key].cash || '', placeholder: 'Hotovost $', style: 'border:2px solid var(--paper-3);border-radius:8px;padding:8px;font:16px var(--f-body)', oninput: e => { sel[key].cash = Math.max(0, Math.min(pl(who).cash, +e.target.value || 0)); } });
          box.append(h('label', { class: 'fl' }, `Hotovost (max ${fmt(pl(who).cash)})`, inp));
          return box;
        };
        b.append(side(i, 'give', `${pl(i).name} dává`), side(b2, 'get', `${pl(b2).name} dává`));
        b.append(h('button', { class: 'btn red', onclick: () => {
          const t = { a: i, b: b2, give: { states: [...sel.give.states], cards: [...sel.give.cards], cash: sel.give.cash }, get: { states: [...sel.get.states], cards: [...sel.get.cards], cash: sel.get.cash } };
          if (!t.give.states.length && !t.give.cards.length && !t.give.cash && !t.get.states.length && !t.get.cards.length && !t.get.cash) { toast('Vyberte, co se má vyměnit.', 'minus'); return; }
          if (!E.tradeValid(G, t)) { toast('Obchod není platný (zkontrolujte hotovost).', 'minus'); return; }
          close();
          if (pl(b2).ai) {
            if (AI.evalTrade(G, t)) { runSide(E.doTrade(G, t)); toast(`${pl(b2).name} přijímá obchod.`, 'plus'); }
            else aiCounterSheet(t);
          } else if (ON && !isMine(b2)) sendOffer(t);
          else offerSheet(t);
        } }, o.counter ? 'Poslat protinávrh' : 'Navrhnout obchod'));
        b.append(h('p', { class: 'note' }, 'Vyměněný stát musí nový majitel znovu legalizovat průjezdem bankou FED. Zapůjčené karty (Chief, Commander, Mafia) obchodovat nelze. Po odmítnutí lze mezi stejnými hráči obchodovat až v příštím kole.'));
      };
      draw();
    });
  }

  // ============ BETA: nastavitelné ceny ============
  const ORIG = {

    dice: { 1: E.DICE_FEE[1], 3: E.DICE_FEE[3], 4: E.DICE_FEE[4] },

  };
  const clone = o => JSON.parse(JSON.stringify(o));
  function confFrom(P) {
    const c = clone(ORIG);
    if (P && P.states) Object.keys(P.states).forEach(s => { if (c.states[s]) Object.assign(c.states[s], P.states[s]); });
    if (P && P.cards) Object.keys(P.cards).forEach(k => { if (c.cards[k]) Object.assign(c.cards[k], P.cards[k]); });
    if (P && P.rules) c.rules = Object.assign({}, c.rules, P.rules);
    return c;
  }
  // ostrá verze: platné ceny a pravidla (odladěné v betě)

  function presetConf() {

    if (P && P.cards) Object.keys(P.cards).forEach(k => { if (c.cards[k]) Object.assign(c.cards[k], P.cards[k]); });
    if (P && P.rules) c.rules = Object.assign({}, c.rules, P.rules);
    if (P && P.ver) c.pv = P.ver;
    return c;
  }
  function loadConf() { try { const c = JSON.parse(localStorage.getItem(CONF_KEY)); if (c && c.states && (!window.BETA_PRESET || c.pv === window.BETA_PRESET.ver)) return c; } catch (e) { /* nic */ } return presetConf(); }
  function saveConf(c) { if (window.BETA_PRESET) c.pv = window.BETA_PRESET.ver; try { localStorage.setItem(CONF_KEY, JSON.stringify(c)); } catch (e) { /* nic */ } }
  function applyConf(c) {
    c = c || ORIG;
    E.CONF.startCash = +c.startCash; E.CONF.bonus = +c.bonus; const R = c.rules || {}; E.CONF.shDeposit = !!R.shDeposit; E.CONF.halfRefund = !!R.halfRefund; E.CONF.bcBankMult = !!R.bcBankMult; E.CONF.stack = R.stack || 'mul';
    ['chief', 'commander'].forEach(k => { const C = E.CARDS[k]; C.desc0 = C.desc0 || C.desc; C.desc = C.desc0 + (E.CONF.bcBankMult ? ' Navýšení výplaty v BC platí banka, ne majitel Californie.' : ''); });

    Object.keys(E.LABELS).forEach(k => { E.LABELS[k].price = +(c.labels[k] != null ? c.labels[k] : ORIG.labels[k]); });
    D.chains.forEach((ch, k) => { ch.price = +(c.chains[k] != null ? c.chains[k] : ORIG.chains[k]); });
    Object.keys(D.states).forEach(k => { const v = c.states[k] || ORIG.states[k]; D.states[k].price = +v.price; D.states[k].fed = +v.fed; D.states[k].bc = +v.bc; });

  function chainName(ch) {
