    if (!snap.exists()) { toast('Hra s tímto kódem neexistuje.', 'minus'); return false; }
    const gm = snap.val(); const seats = gm.seats || [];
    if (gm.meta.host === Net.uid) { ON = { code, host: true, uid: Net.uid, mine: new Set(), seq: 0 }; return resumeOnline({ code, host: true, g: (onlineSaved() || {}).g }); }
    let seat = seats.findIndex(s => s && s.uid === Net.uid);
    if (seat < 0) {
      if (gm.meta.status !== 'lobby') { toast('Tato hra už začala a nemá pro vás volné místo.', 'minus'); return false; }
      for (let k = 0; k < seats.length && seat < 0; k++) {
        if (!seats[k] || seats[k].ai || seats[k].uid) continue;
        const r = await Net.ref(`games/${code}/seats/${k}`).transaction(cur => (cur == null ? null : !cur.ai && !cur.uid ? Object.assign({}, cur, { uid: Net.uid, name: name || cur.name }) : undefined));
        if (r.committed && r.snapshot.val() && r.snapshot.val().uid === Net.uid) seat = k;
      }
      if (seat < 0) { toast('Ve hře už není volné místo.', 'minus'); return false; }
    }
    ON = { code, host: false, uid: Net.uid, mine: new Set([seat]), seq: -1, joined: Date.now() };
    useRemoteEngine(true);
    onlineSave();
    clientListen();
    if (gm.meta.status === 'lobby') showLobby();
    return true;
  }
  async function resumeOnline(os) {
    if (!(await netStart())) return false;
    const snap = await Net.ref('games/' + os.code).get();
    if (!snap.exists()) { toast('Online hra už neexistuje.', 'minus'); try { localStorage.removeItem(ON_KEY); } catch (e) { /* nic */ } showSetup(); return false; }
    const gm = snap.val();
    if (os.host && gm.meta.host !== Net.uid) os = { code: os.code, host: false };
    if (os.host) {
      const seats = gm.seats || [];
      ON = { code: os.code, host: true, uid: Net.uid, mine: new Set([seats.findIndex(s => s && s.uid === Net.uid)]), seq: 0, seats };
      if (gm.state && gm.state.seq) ON.seq = gm.state.seq;
      onlineSave();
      if (gm.meta.status === 'lobby' || !os.g) { showLobby(); return true; }
      ON.level = gm.meta.level;
      hostListen();
      presence(`games/${ON.code}/meta/hostOn`);
      startGame(os.g);
      commit([]);
      return true;
    }
    return joinOnline(os.code, '');
  }
  function showLobby() {
    G = null;
    $('#app').hidden = true;
    const S = $('#setup'); S.hidden = false; S.innerHTML = '';
    const card = h('div', { class: 'setup-card', id: 'lobby' });
    S.append(h('div', { class: 'hero-wrap' }, h('div', { class: 'hero' }, h('img', { src: 'title.webp', alt: 'Immigrants to the United States of America' }))), card);
    const list = h('div', { class: 'lobbylist' });
    card.append(h('div', { class: 'sec' }, 'Online hra'), h('div', { class: 'codebox' }, h('small', null, 'Kód hry'), h('b', { id: 'gamecode' }, ON.code)));
    if (ON.host) {
      card.append(h('p', { class: 'note', style: 'margin:0' }, 'Pošlete kód nebo odkaz ostatním hráčům. Připojí se v aplikaci Immigrants BETA tlačítkem „Připojit se“.'),
        h('button', { class: 'btn soft', onclick: async () => {
          const url = shareLink(ON.code), text = `Hraj se mnou Immigrants! Kód hry: ${ON.code}`;
          try { if (navigator.share) { await navigator.share({ title: 'Immigrants – online hra', text, url }); return; } } catch (e) { return; }
          try { await navigator.clipboard.writeText(text + ' ' + url); toast('Odkaz zkopírován.'); } catch (e) { toast(url); }
        } }, 'Sdílet odkaz'));
    } else card.append(h('p', { class: 'note', style: 'margin:0' }, 'Jste připojen. Hra začne, až ji zakladatel spustí.'));
    card.append(list);
    const start = h('button', { class: 'btn red big', onclick: () => hostStart() }, 'Začít hru');
    if (ON.host) card.append(start, h('p', { class: 'note', style: 'margin:-4px 0 0' }, 'Místa, kam se nikdo nepřipojí, převezme počítač.'));
    card.append(h('button', { class: 'btn ghost', onclick: () => confirmBox(ON.host ? 'Zrušit online hru?' : 'Opustit online hru?', ON.host ? 'Zrušit' : 'Opustit', () => {
      if (ON.host) gref('meta/status').set('cancel');
      else { const k = [...ON.mine][0]; gref('seats/' + k + '/uid').set(''); }
      leaveOnline(true); showSetup();
    }) }, ON.host ? 'Zrušit hru' : 'Opustit'));
    gref('seats').on('value', s => {
      const seats = s.val() || []; ON.seats = seats; list.innerHTML = '';
      seats.forEach((st, k) => {
        if (!st) return;
        const me = ON.mine.has(k);
        list.append(h('div', { class: 'lobbyrow' + (st.ai || st.uid ? '' : ' free') }, h('span', { html: starSVG(st.color, 28) }), h('b', null, st.name + (me ? ' (vy)' : '')),
          h('span', { class: 'tag' }, st.ai ? 'počítač' : st.uid ? 'připojen' : 'čeká na hráče…')));
      });
    });

  }
  async function hostStart() {
    const gm = (await gref().get()).val();
    const seats = gm.seats || [];
    const ps = seats.map(st => { const ai = st.ai || !st.uid; return { name: st.name, ai, color: st.color, level: ai ? gm.meta.level : 1 }; });
    const conf = JSON.parse(gm.conf);
    applyConf(conf);
    const ng = E.newGame(ps, gm.meta.opts || {});
    ng.conf = conf;
    seats.forEach((st, k) => { if (!st.ai && !st.uid) gref('seats/' + k).update({ ai: true }); });
    gref('seats').off(); gref('meta/status').off();
    await gref('meta/status').set('play');
    ON.level = gm.meta.level;
    hostListen();
    presence(`games/${ON.code}/meta/hostOn`);
    presence(`games/${ON.code}/seats/${[...ON.mine][0]}/on`);
    startGame(ng);
    commit([]);
  }

  // ============ start ============
  function init() {
    wrap = $('#mapwrap'); world = $('#world'); overlay = $('#overlay');
    setupPanZoom();
    $('#zin').onclick = () => zoomAt(1.5, wrap.clientWidth / 2, wrap.clientHeight / 2);
    $('#zout').onclick = () => zoomAt(1 / 1.5, wrap.clientWidth / 2, wrap.clientHeight / 2);
    $('#zfit').onclick = () => fitView();
    $('#zme').onclick = () => { if (G) focusNodes([pl(G.pending && G.pending.p != null ? G.pending.p : G.cur).node], 0.35); };
    $('#menuBtn').onclick = openMenu;
    $('#chips').addEventListener('scroll', placeLastRoll, { passive: true });
    window.addEventListener('resize', () => setTimeout(placeLastRoll, 50));
    showSetup();
    const m = location.search.match(/[?&]hra=([A-Za-z0-9]{4})/);
    if (m && ONLINE_OK) joinSheet(m[1].toUpperCase());
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();
})();
</script>

<script>if('serviceWorker' in navigator){addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));}</script>
